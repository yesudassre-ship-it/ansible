---
- name: demo of filter 
  hosts: localhost
  connection: local
  become: true
  tasks: 
    - name: test the commands module
      # command: cat /etc/passwd | grep ec2-user
      shell: cat /etc/passwd | grep ec2-user
      register: ec2_user_output
    - name: print the output
      debug: 
        msg: "{{ ec2_user_output }}"
    - name : get the files 
      shell: ls - ltr > /tmp/txt.txt
      register: files_output
    - name: print the file 
      debug:
        msg: "{{ files_output }}"        