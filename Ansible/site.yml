---
- name: print facts
  hosts: localhost
  connection: local
  gather_facts: yes
  become: yes 
  tasks:
    - name: print the facts
      debug:
        msg: "{{ ansible_facts }}"        
    - name: print the ip 
      debug:
        msg: |
            "{{ ansible_facts.all_ipv4_addresses }}"
            "{{ ansible_facts['bios_vendor'] }}"
  vars: 
    package: 
        - ngnix
        - mysql
        - git
        - net-tools
        - htop
    -name: install package
     package: 
         name: "{{ item }}"
         state: present
         loop: "{{ package }}"	        