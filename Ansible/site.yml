---
- name: take facts & install pakges
  hosts: localhost
  connection: local
  gather_facts: yes
  become: yes 
  # tasks:
    # - name: print the facts
      # debug:
        # msg: "{{ ansible_facts }}"        
    # - name: print the ip 
      # debug:
        # msg: |
            # "{{ ansible_facts.all_ipv4_addresses }}"
            # "{{ ansible_facts['bios_vendor'] }}"
  vars:
    packages:
      - { name: 'ngnix' state: 'present' }
      - { name: 'mysql' state: 'absent' }
      - { name: 'git' state: 'absent' }
      - { name: 'net-tools' state: 'absent' }
      - { name: 'htop' state: 'absent' }
  tasks:
    - name: install packages
      package:
        name: "{{ name }}"
      loop: "{{ packages }}"