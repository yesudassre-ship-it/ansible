---
- name: print facts
  hosts: localhost
  connection: local
  gather_facts: yes
  become: yes 
  tasks:
    - name: print the facts
      debug:
        msg: "{{ ansible_facts }}"        
    - name: print the ip 
      debug:
        msg: |
            "{{ ansible_facts.all_ipv4_addresses }}"
            "{{ ansible_facts['bios_vendor'] }}"
  vars: 
    packages: 
		- ngnix
		- mysql
		- git
		- net-tools
		- htop
  tasks:
	-name: install packages
		packages: 
			name: "{{ item }}"
			state: present
		loop: "{{ packages }}"	        